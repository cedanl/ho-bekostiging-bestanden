[project]
name = "ho-bekostiging-bestanden"
version = "0.1.0"
description = "Leest DUO HO-bekostigingsbestanden in en zet ze om naar schone, onderzoeksklare data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "CEDA", email = "ceda@cedanl.org" }]
dependencies = [
    "altair>=5.4",
    "polars>=1.0",
    "streamlit>=1.50",  # width="stretch" en theme.chartCategoricalColors
]

[project.scripts]
ho = "ho_bekostiging_bestanden.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.0a1",
]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
    "pymdown-extensions>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ho_bekostiging_bestanden"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py313"
# Codeblokken in specs/plannen (docs/) niet formatteren.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]
# PLW1514 (unspecified-encoding) is een preview-regel; alleen die aanzetten.
preview = true
explicit-preview-rules = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations (o.a. Polars) direct zichtbaar maken als fout.
filterwarnings = ["error::DeprecationWarning"]

[tool.ty.environment]
python-version = "3.13"
# De app importeert _utils/_tabel_docs via sys.path; laat ty ze ook vinden.
extra-paths = ["app"]
